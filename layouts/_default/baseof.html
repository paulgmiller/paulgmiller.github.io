<!DOCTYPE html>
<html lang="en">
	{{ partial "head.html" . }}
	<body>
		<a class="skip-link" href="#content">Skip to content</a>
		<div id="container">
			<aside id="side" aria-label="Site navigation">
				<a href="/" id="home" title="Home"><img src="/img/logo.png" alt="Home" width="144" /></a>
				<div id="hometext"><a href="/" >{{ .Site.Title }}</a></div>
				<nav class="section" aria-label="Browse the blog">
					<ul>
						<li><a href="/about/">about</a></li>
						<li><a href="/rss.xml">feed</a></li>
						<li><a id="new-post" href="{{.Site.Params.giturl}}/new/master/content/posts?filename=YYYY-MM-DD-title.md&value=%2D%2D%2D%0Alayout%3A%20post%0Atitle%3A%20%0Adate%3A%20YYYY-MM-DD%0A%2D%2D%2D%0A">post</a></li>
						<li class="tag-section"><span class="nav-label">Tags</span>
							<ul>
							<li><a href="/tags/beer">beer</a></li>
							<li><a href="/tags/hiking">hiking</a></li>
							<li><a href="/tags/tech">tech</a></li>
							<li><a href="/tags/family">family</a></li>
							<li><a href="/tags/books">books</a></li>
							<li><a href="/tags/recipes">recipes</a></li>
							<li><a href="/tags/bets">bets</a></li>
							<li><a href="/tags/photos">photos</a></li>
							</ul>
						</li>
					</ul>
				</nav>
			</aside>
			<main id="content" tabindex="-1">
				{{ block "main" . }}{{ end }}
			</main>
		</div>
		<script src="/js/new-post.js"></script>
		<script src="//cdn.jsdelivr.net/highlight.js/9.4.0/highlight.min.js"></script>
		<script>hljs.initHighlightingOnLoad();</script>
	</body>
</html>
